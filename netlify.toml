[build]
  command = "npm ci --include=optional && npm install --no-save @tailwindcss/oxide-linux-x64-gnu && npm run build --workspace packages/web"
  publish = "packages/web/dist"
  functions = "netlify/functions"

[build.environment]
  TMDB_API_KEY = "d52274bb19dbdd5dd305c09a7afcf1ef"
  NODE_VERSION = "18"
  npm_config_platform = "linux"
  npm_config_arch = "x64"
  npm_config_libc = "glibc"

[[redirects]]
  from = "/api/*"
  to = "https://accounts-ranger-composition-telling.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/addon/*"
  to = "https://accounts-ranger-composition-telling.trycloudflare.com/addon/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
